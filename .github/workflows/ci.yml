name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      AHK_BUILD_INTEGRATION: "1"
      AHK_BUILD_TARBALL_SMOKE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: pack
        run: pnpm pack:check
      - run: pnpm run tarball:smoke "${{ steps.pack.outputs.tarball }}"
